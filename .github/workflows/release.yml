# This workflow is managed by gh actions-lock.

name: release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-draft-release:
    runs-on: ubuntu-latest
    steps:
      - id: release-drafter
        uses: release-drafter/release-drafter@v7
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/checkout@v7
      - name: Install GLib tools
        run: sudo apt-get update
      - name: Install packages
        run: sudo apt-get install -y libglib2.0-bin zip unzip
      - uses: $/.github/actions/bun-deps
      - run: bun run pack
      - uses: bgpat/release-asset-action@v2
        with:
          pattern: genai-usage@bgpat.github.io.zip
          github-token: ${{ secrets.GITHUB_TOKEN }}
          release-id: ${{ steps.release-drafter.outputs.id }}
          allow-overwrite: true
