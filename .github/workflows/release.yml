name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install tools
        run: sudo apt-get update
      - name: Install packages
        run: sudo apt-get install -y libglib2.0-bin zip unzip
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Test
        run: bun test
      - name: Package
        run: bun run pack
      - uses: softprops/action-gh-release@v2
        with:
          files: genai-usage@bgpat.github.io.zip
