# This workflow is managed by gh actions-lock.

name: Shell versions

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened

jobs:
  fedora-smoke:
    name: fedora ${{ matrix.fedora }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        fedora: ['39', '40', '41', '42']
    container:
      image: fedora:${{ matrix.fedora }}
    steps:
      - uses: actions/checkout@v7
      - name: Install unzip for setup-bun
        run: dnf install -y unzip
      - uses: oven-sh/setup-bun@v2
      - name: Install GNOME Shell
        run: dnf install -y gnome-shell mutter glib2 zip gjs
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Headless smoke
        run: sh tests/integration/smoke.sh

  report:
    name: Shell versions
    needs: fedora-smoke
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require all Fedora smoke jobs to pass
        env:
          FEDORA_SMOKE_RESULT: ${{ needs.fedora-smoke.result }}
        run: |
          if [ "$FEDORA_SMOKE_RESULT" != "success" ]; then
            echo "::error::Fedora smoke matrix result: $FEDORA_SMOKE_RESULT"
            exit 1
          fi
