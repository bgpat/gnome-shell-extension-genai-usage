# This workflow is managed by gh actions-lock.

name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - name: Install GLib and GJS tools
        run: sudo apt-get update
      - name: Install packages
        run: sudo apt-get install -y libglib2.0-bin gjs zip unzip
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Typecheck
        run: bun run typecheck
      - name: Lint
        run: bun run lint
      - name: Test
        run: bun test
      - name: Package
        run: bun run pack
      - name: Subprocess integration
        run: gjs -m tests/gjs/subprocess.js

  smoke:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - name: Install GNOME Shell
        run: sudo apt-get update
      - name: Install GNOME packages
        run: sudo apt-get install -y gnome-shell mutter dbus-x11 libglib2.0-bin unzip zip gjs
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Headless smoke
        run: sh tests/integration/smoke.sh
